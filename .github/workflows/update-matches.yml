name: Verileri Güncelle (Maç + Puan Durumu)

# Otomatik: her gün Türkiye saatiyle 00:01'de çalışır + istenirse "Run workflow"
# butonuyla elle de tetiklenebilir.
on:
  workflow_dispatch:
  schedule:
    # 21:01 UTC = 00:01 Türkiye saati (UTC+3, sabit). Gün dönünce geçmiş maçlar
    # düşer, o günün maçları "bugün" olarak öne çıkar.
    - cron: '1 21 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Logo optimizasyonu için Pillow kur
        run: python -m pip install --quiet Pillow

      - name: Maç verilerini çek (TBF İstanbul)
        run: python scripts/update_matches.py

      - name: Puan durumunu çek (TBF)
        run: python scripts/update_standings.py

      - name: Maç sonuçlarını çek (TBF, U10-U12)
        run: python scripts/update_results.py

      - name: Değişiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/standings.json data/results.json data/logos
          if git diff --cached --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "chore: maç ve puan durumu verilerini güncelle ($(date -u +%Y-%m-%d))"
            git push
            echo "Veriler güncellendi ve push edildi."
          fi
