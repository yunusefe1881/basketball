name: Verileri Güncelle (Maç + Puan Durumu)

# Yarı otomatik: yalnızca "Run workflow" butonuyla elle tetiklenir.
# (İleride otomatik çalışması istenirse aşağıdaki schedule satırlarını açın.)
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'   # her gün 06:00 UTC (09:00 TR)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Maç verilerini çek (TBF İstanbul)
        run: python scripts/update_matches.py

      - name: Puan durumunu çek (TBF)
        run: python scripts/update_standings.py

      - name: Değişiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/standings.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "chore: maç ve puan durumu verilerini güncelle ($(date -u +%Y-%m-%d))"
            git push
            echo "Veriler güncellendi ve push edildi."
          fi
